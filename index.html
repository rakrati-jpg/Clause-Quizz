<script>

const FIREBASE_CONFIG = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_PROJECT.firebaseapp.com",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_PROJECT.firebasestorage.app",
  messagingSenderId: "PASTE_SENDER_ID",
  appId: "PASTE_APP_ID"
};

let liveDb = null, liveStudentId = null, liveReady = false;

function liveInit(){
  if(FIREBASE_CONFIG.apiKey === "PASTE_API_KEY") return;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    liveDb = firebase.firestore();
    firebase.auth().signInAnonymously().then(()=>{
      liveReady = true;
      updateLiveBadge("ON — Admin ko live progress dikhega");
      sendProgress();
    }).catch(e=>updateLiveBadge("OFF — Firebase login error"));
  }catch(e){ updateLiveBadge("OFF — Firebase setup incomplete"); }
}
function updateLiveBadge(text){
  const el=document.getElementById("liveBadge");
  if(el) el.innerHTML="● Live Tracking: <b>"+text+"</b>";
}
function studentId(){
  let id=localStorage.getItem("clauses_student_id");
  if(!id){
    id="ST-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,7).toUpperCase();
    localStorage.setItem("clauses_student_id",id);
  }
  return id;
}
function sendProgress(){
  if(!liveReady || !liveDb) return;
  const name=(document.getElementById("name")?.value||"Student").trim()||"Student";
  let attempted=0,correct=0,wrong=0;
  if(typeof questions!=="undefined"){
    questions.forEach(q=>{
      const el=document.querySelector('input[name="q'+q.id+'"]:checked');
      if(el){attempted++; if(Number(el.value)===q.answer) correct++; else wrong++;}
    });
  }
  liveDb.collection("students").doc(liveStudentId).set({
    studentId:liveStudentId,name,attempted,correct,wrong,
    unattempted:200-attempted,
    percentage:Number((correct/200*100).toFixed(1)),
    status:(typeof submitted!=="undefined" && submitted)?"Submitted":"In Progress",
    lastUpdated:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true}).catch(()=>{});
}
function setupLive(){
  liveStudentId=studentId();
  const name=document.getElementById("name");
  if(name) name.addEventListener("input",sendProgress);
  const b=document.createElement("div");
  b.id="liveBadge";
  b.style="margin:8px 0;padding:8px 12px;border-radius:9px;background:#eef7ff;color:#15527a;font-size:13px";
  b.innerHTML="● Live Tracking: <b>Connecting…</b>";
  if(name?.parentElement) name.parentElement.appendChild(b);
  setInterval(sendProgress,3000);
}
liveInit();
document.addEventListener("DOMContentLoaded",setupLive);
</script>
