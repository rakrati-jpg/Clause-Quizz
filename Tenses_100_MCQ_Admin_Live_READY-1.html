<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tenses — Admin Live Dashboard</title><style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f4f6fb;color:#172033;margin:0}.wrap{max-width:1000px;margin:auto;padding:14px}
.hero{background:white;border-radius:18px;padding:20px;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.box{background:white;border-radius:14px;padding:16px;box-shadow:0 2px 10px #0001}.num{font-size:30px;font-weight:900}
.student{background:white;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 2px 10px #0001}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.metric{padding:10px;border-radius:10px;background:#f7f8fa}.good{color:#087f45;font-weight:800}.bad{color:#c62828;font-weight:800}.live{color:#087f45;font-weight:800}.search{width:100%;padding:13px;border-radius:10px;border:1px solid #bbb;font-size:16px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:25px}}
</style></head><body><main class="wrap"><section class="hero"><h1>Tenses — 100 MCQ Admin</h1><p>Students ka live attempt, <b>Sahi, Galat, Percentage</b> aur status.</p><b id="conn">● Connecting...</b></section>
<section class="grid"><div class="box">Total Students<div class="num" id="ts">0</div></div><div class="box">Live<div class="num" id="lv">0</div></div><div class="box">Submitted<div class="num" id="sub">0</div></div><div class="box">Total Attempts<div class="num" id="att">0</div></div></section>
<input id="search" class="search" placeholder="Student name search..."><div id="list"></div></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const cfg={"apiKey": "AIzaSyBdLKNZtCi8DNwxfPN4i4e_X8a-kQblI7k", "authDomain": "clause-quiz.firebaseapp.com", "projectId": "clause-quiz", "storageBucket": "clause-quiz.firebasestorage.app", "messagingSenderId": "290285614510", "appId": "1:290285614510:web:39cc603d61ef827b73c43f", "measurementId": "G-CR2ZHRM6QC"};let all=[];
function draw(){let q=(document.getElementById("search").value||"").toLowerCase();let a=all.filter(x=>(x.name||"").toLowerCase().includes(q));
document.getElementById("ts").textContent=a.length;document.getElementById("lv").textContent=a.filter(x=>x.status==="Live").length;document.getElementById("sub").textContent=a.filter(x=>x.submitted).length;document.getElementById("att").textContent=a.reduce((s,x)=>s+(x.attempted||0),0);
document.getElementById("list").innerHTML=a.map(x=>`<div class="student"><h2 style="margin:0">${x.name||"Student"}</h2><small>${x.studentId||""}</small><div class="metrics"><div class="metric">Status<br><b class="${x.status==="Live"?"live":""}">${x.status||"Live"}</b></div><div class="metric">Attempted<br><b>${x.attempted||0}/100</b></div><div class="metric good">✓ Sahi<br><b>${x.correct||0}</b></div><div class="metric bad">✕ Galat<br><b>${x.wrong||0}</b></div><div class="metric">Percentage<br><b>${x.percentage||0}%</b></div><div class="metric">Progress<br><b>${x.progress||"0/100"}</b></div></div></div>`).join("")||"<div class='student'>No students found.</div>"}
document.getElementById("search").oninput=draw;
firebase.initializeApp(cfg);firebase.auth().signInAnonymously().then(()=>{document.getElementById("conn").textContent="● Connected — Live updates ON";firebase.firestore().collection("tense_students").onSnapshot(s=>{all=s.docs.map(d=>d.data());draw()})}).catch(e=>document.getElementById("conn").textContent="● Login error: "+e.message);
</script></body></html>
